<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#fbfaf6" />
    <title>贪吃蛇 · 像素橱窗</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hud">
        <div class="score">
          <span>SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="score">
          <span>BEST</span>
          <strong id="best">0</strong>
        </div>
        <button id="restart" type="button">重新开始</button>
      </header>

      <div class="stage">
        <canvas id="game" aria-label="贪吃蛇游戏区域"></canvas>
        <div class="overlay" id="overlay">
          <p id="overlay-title">准备好了吗？</p>
          <p id="overlay-text">方向键 / WASD 开始，空格暂停</p>
          <button id="start" type="button">开始游戏</button>
        </div>
      </div>

      <div class="pad" aria-label="方向控制">
        <button class="up" data-dir="up" type="button" aria-label="向上">↑</button>
        <button class="left" data-dir="left" type="button" aria-label="向左">←</button>
        <button class="down" data-dir="down" type="button" aria-label="向下">↓</button>
        <button class="right" data-dir="right" type="button" aria-label="向右">→</button>
      </div>

      <p class="tip">方向键 / WASD 控制 · 空格暂停 · 手机可用下方方向键或滑动</p>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
